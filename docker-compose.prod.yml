services:
  backend:
    image: ${ECR_IMAGE}
    ports:
      - "8000:8000"
    environment:
      - DYNAMODB_TABLE=expenses-prod
      - AWS_REGION=us-east-1
      - JWT_SECRET=${JWT_SECRET}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
