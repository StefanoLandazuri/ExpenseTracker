services:
  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - dynamodb-local
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - JWT_SECRET=ThisIsASecretKeyForJWT
    volumes:
      - ./backend:/app